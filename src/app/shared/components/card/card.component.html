<div class="custom-card">
  <div class="card-image">
    <img [src]="image" class="custom-card-img" [alt]="title || adTitle || 'Perfil'" />
    <div class="plan-badge" *ngIf="planBadgeImage" [ngClass]="planBadgeClass">
      <img [src]="planBadgeImage" alt="Plan" />
    </div>
  </div>

  <div class="custom-card-body">
    <div class="card-identity">
      <div class="card-row">
        <h5 class="custom-card-title">{{ title }}</h5>
        <p class="custom-card-age" *ngIf="age">
          <span class="age-number">{{ age }}</span>
          <span class="age-label">{{ 'COMMON.YEARS' | translate }}</span>
        </p>
      </div>

      <p class="custom-card-ad-title" *ngIf="adTitle">{{ adTitle }}</p>
    </div>

    <div class="verified-row">
      <span class="verified-badge" [class.is-hidden]="!isVerified">
        <i class="bi bi-patch-check-fill verified-icon" aria-hidden="true"></i>
        <span class="verified-text">{{ 'PROFILE.VERIFIED' | translate }}</span>
      </span>
      <span class="city-badge" *ngIf="city">
        <i class="bi bi-geo-alt-fill city-icon" aria-hidden="true"></i>
        <span class="city-text">{{ city }}</span>
      </span>
    </div>
  </div>
</div>
