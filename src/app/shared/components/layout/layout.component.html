<div class="layout">
    <!-- HEADER -->
    <app-header [hidden]="loader"></app-header>
    <div class="layout-content" #layoutContent>
        <router-outlet></router-outlet>
    </div>
        <button
            class="layout-scroll-top-btn"
            type="button"
            (click)="scrollToTop()"
            aria-label="Volver al inicio"
        >
            <span aria-hidden="true">↑</span>
        </button>
     <!-- FOOTER -->
    <footer [hidden]="loader" class="footer">
        <div class="footer-inner">
            <p>© 2026 Flammes Rouges. {{ 'FOOTER.RIGHTS' | translate }}</p>
            <nav class="footer-links" aria-label="Legal">
                <a routerLink="/legal">{{ 'FOOTER.LEGAL' | translate }}</a>
                <a routerLink="/legal" fragment="privacidad">{{ 'FOOTER.PRIVACY' | translate }}</a>
                <a routerLink="/legal" fragment="terminos">{{ 'FOOTER.TERMS' | translate }}</a>
            </nav>
        </div>
    </footer>
</div>
